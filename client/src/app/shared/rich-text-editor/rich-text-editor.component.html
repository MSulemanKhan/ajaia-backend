<div class="toolbar" role="toolbar" aria-label="Text formatting">
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('bold')" title="Bold"><strong>B</strong></button>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('italic')" title="Italic"><em>I</em></button>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('underline')" title="Underline"><u>U</u></button>
  <span class="tb-divider"></span>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('formatBlock', 'H1')" title="Heading 1">H1</button>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('formatBlock', 'H2')" title="Heading 2">H2</button>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('formatBlock', 'P')" title="Paragraph">¶</button>
  <span class="tb-divider"></span>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('insertUnorderedList')" title="Bulleted list">&bull; List</button>
  <button type="button" class="tb-btn" [disabled]="disabled" (mousedown)="$event.preventDefault()" (click)="exec('insertOrderedList')" title="Numbered list">1. List</button>
</div>
<div
  #editor
  class="editor-surface"
  [attr.contenteditable]="!disabled"
  [class.disabled]="disabled"
  (input)="onInput()"
  (blur)="onBlur()"
></div>
